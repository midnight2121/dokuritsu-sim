name: rotate-password

on:
  schedule:
    # 毎月1日・15日 00:00 UTC = 日本時間 9:00
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 新しいパスワードを作る
        id: pw
        run: |
          PW=$(tr -dc 'abcdefghjkmnpqrstuvwxyz23456789' </dev/urandom | head -c 8)
          echo "::add-mask::$PW"
          echo "pw=$PW" >> "$GITHUB_OUTPUT"

      - name: ページを暗号化して index.html を作り直す
        env:
          STATICRYPT_PASSWORD: ${{ steps.pw.outputs.pw }}
        run: |
          npx -y staticrypt@3 261006_dokuritsu-sim-repo/src/index.html -d . --remember 14 --short -c false \
            --template-title "独立開業 収支シミュレーション" \
            --template-instructions "カリスタ株式会社の社内向けツールです。パスワードは前田までお問い合わせください。" \
            --template-button "開く" \
            --template-placeholder "パスワード" \
            --template-remember "この端末で14日間記憶する" \
            --template-error "パスワードが違います" \
            --template-color-primary "#8877AC" \
            --template-color-secondary "#F7F4F0"

      - name: 変更を保存する
        run: |
          git config user.name "password-rotation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Rotate password $(TZ=Asia/Tokyo date +%Y-%m-%d)" || echo "no changes"
          git push

      - name: Slack の DM に新しいパスワードを送る
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PW: ${{ steps.pw.outputs.pw }}
        run: |
          DATE=$(TZ=Asia/Tokyo date +%Y/%m/%d)
          MSG="独立開業シミュレーションのパスワードを更新しました（${DATE}）
新しいパスワード： ${PW}
URL: https://midnight2121.github.io/dokuritsu-sim/
※前回のパスワードは使えなくなっています。"
          jq -n --arg t "$MSG" '{text:$t}' | curl -s -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
